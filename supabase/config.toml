# Local Supabase for development and CI (`supabase start`, Docker required).
# Only Drizzle migrations in ./drizzle change the schema (ADR-0002, rule 4);
# the Supabase migrations folder is not used.

project_id = "claudeproject-test1"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = false

# Local mail catcher (Mailpit); invite and reset mails end up here.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# The invitation mail links to `<SITE_URL>/auth/confirm` (`redirectTo` of the invite; see
# supabase/templates/invite.html). Supabase only accepts redirect addresses in this list.
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://localhost:3000",
  "http://127.0.0.1:3000/auth/confirm",
  "http://localhost:3000/auth/confirm",
]

# Invitation mail (design B7/G2): the link goes to our own `/auth/confirm` route with the token,
# not to Supabase's own confirmation address. Real Supabase projects have the same template
# in the dashboard (see the README); this file only applies to the local Supabase.
[auth.email.template.invite]
subject = "Je uitnodiging voor de planning"
content_path = "./supabase/templates/invite.html"

# Rate limits of the LOCAL Auth server only (local development and the CI runner), approved by
# Jurgen on 24/11/2026. The end-to-end tests sign in many times from one IP address (the runner),
# which the default of 30 per 5 minutes does not allow. This file does not apply to real
# Supabase projects: their limits are set in their own dashboard and stay at the defaults.
#
# The same goes for the number of mails per hour: the end-to-end tests send a few invitations per
# run, and the default of the local Auth server is only 2 per hour. Raised for the same reason,
# only locally (BT-06).
[auth.rate_limit]
sign_in_sign_ups = 300
email_sent = 100

# Not used; switched off to keep `supabase start` fast.
[studio]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
