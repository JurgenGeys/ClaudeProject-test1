# Local Supabase for development and CI (`supabase start`, Docker required).
# Only Drizzle migrations in ./drizzle change the schema (ADR-0002, rule 4);
# the Supabase migrations folder is not used.

project_id = "claudeproject-test1"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = false

# Local mail catcher (Mailpit); invite and reset mails end up here.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000"]

# Not used; switched off to keep `supabase start` fast.
[studio]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
